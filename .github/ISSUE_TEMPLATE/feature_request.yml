name: Feature request
description: Suggest a concrete improvement to MDCP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow and where it currently breaks down.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should MDCP do differently?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Claude Code plugin
        - Claude.ai workflow guidance
        - ChatGPT guidance
        - Codex guidance
        - Agent skills
        - MCP setup
        - Documentation
        - Security and validation
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or references
      description: Link relevant docs or provide a small reproducible example.
    validations:
      required: false
