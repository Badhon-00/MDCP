name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - name: skill health report
        run: python3 scripts/skill_report.py --check --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: token-meter smoke test
        run: python3 scripts/token-meter.py --help > /dev/null

      - name: agent fabric unit tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m mdcp_fabric.cli --help
      - name: skill catalog smoke test
        run: |
          python3 scripts/build_skill_catalog.py
          python3 -c "import json; d=json.load(open('site/catalog.json')); assert d['count'] > 0; assert d['count'] == len(d['skills'])"
