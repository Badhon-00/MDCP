name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - name: skill health report
        run: python3 scripts/skill_report.py --check --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: token-meter smoke test
        run: python3 scripts/token-meter.py --help > /dev/null

      - name: agent fabric unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_agent_fabric.py' -v
          python3 -m mdcp_fabric.cli --help
