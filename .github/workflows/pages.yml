name: Publish MDCP Skill Explorer

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "scripts/build_skill_catalog.py"
      - "scripts/test_site.py"
      - "site/**"
      - "README.md"
      - "LICENSE"
      - "TRADEMARKS.md"
      - "docs/DOMAIN_AND_OWNERSHIP.md"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "scripts/build_skill_catalog.py"
      - "scripts/test_site.py"
      - "site/**"
      - "README.md"
      - "LICENSE"
      - "TRADEMARKS.md"
      - "docs/DOMAIN_AND_OWNERSHIP.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build searchable skill catalog
        run: python3 scripts/build_skill_catalog.py

      - name: Validate generated site
        run: python3 scripts/test_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
