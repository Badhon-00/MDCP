[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcp-agent-fabric"
version = "0.3.0"
description = "Cross-platform skill distribution and bounded parallel repository analysis"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mdcp-fabric = "mdcp_fabric.cli:main"

[tool.setuptools]
packages = ["mdcp_fabric"]
